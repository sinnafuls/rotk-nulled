name: Release
# Fork release workflow for sinnafuls/rotk-nulled.
#
# Rebuilds the Zig-based gameplay patch and the .NET diagnostics helper;
# verifies the pinned native hashes; packages an unsigned NSIS installer;
# publishes a release immediately (no draft).
#
# Native test suites are NOT re-run here (they run in CI on every push to
# main). This workflow only fires on a version tag, so main is already green
# by definition.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      CI: "true"

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag matches package.json version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion."
          }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Install .NET (diagnostics helper)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Split the Zig object cache from the global one
        shell: pwsh
        run: '"ZIG_LOCAL_CACHE_DIR=$env:RUNNER_TEMP\zig-local-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Zig object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-local-cache
          key: zig-cache-${{ runner.os }}-0.15.2-${{ hashFiles('native/gameplaypatch/**/*.c', 'native/gameplaypatch/**/*.h', 'native/gameplaypatch/build-gameplay-patch.ps1') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-0.15.2-

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('native/**/*.csproj', 'native/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify the pinned Vivox proxy
        shell: pwsh
        run: |
          # The proxy is upstream's own OPTI1 build. The fork no longer pins a
          # previous binary; it prevents the server-supplied module from ever
          # loading by removing rotkc.dll instead (see game-launcher.ts).
          $h = (Get-FileHash -LiteralPath "resources\patches\vivoxsdk_x64.dll" -Algorithm SHA256).Hash
          if ($h.ToUpperInvariant() -ne "566C0940F7BA62A1DCCAFB8482F39F151BF052E00C97BB8C737E77487879ACD0") {
            throw "Vivox proxy SHA-256 mismatch: got $h"
          }

      - name: Build the gameplay patch (dinput8.dll)
        shell: pwsh
        run: |
          npm run build:gameplay-patch
          $h = (Get-FileHash -LiteralPath "resources\patches\dinput8.dll" -Algorithm SHA256).Hash
          if ($h.ToUpperInvariant() -ne "50FC571D149ADAC1A86470BA79954EA35F713E2D02C8D88EF2BAF22F326F525A") {
            throw "Gameplay patch SHA-256 mismatch: got $h"
          }
          npm run build:vivox
          if ($LASTEXITCODE -ne 0) { throw "Vivox release input validation failed." }
          $proxyHash = (Get-FileHash -LiteralPath "resources\patches\vivoxsdk_x64.dll" -Algorithm SHA256).Hash
          if ($proxyHash -ne "566C0940F7BA62A1DCCAFB8482F39F151BF052E00C97BB8C737E77487879ACD0") {
            throw "Unexpected Vivox proxy SHA-256: $proxyHash"
          }
          npm run prepare:gameplay-patch
          $gameplayHash = (Get-FileHash -LiteralPath "resources\patches\dinput8.dll" -Algorithm SHA256).Hash
          if ($gameplayHash -ne "E969DEDBB8F7A130449C5D38FD3E4F6FB34BA61ABFDC3D413F63A069D4A7B36E") {
            throw "Unexpected shotgun sprint proxy SHA-256: $gameplayHash"
          }
          # Les sidecars alimentent les overrides d'attestation embarqués :
          # une divergence signalerait chaque joueur honnête en écart.
          foreach ($patch in @("steam_api64.dll", "vivoxsdk_x64.dll", "vivoxsdk_x64_v5.dll", "dinput8.dll")) {
            $dllHash = (Get-FileHash -LiteralPath "resources\patches\$patch" -Algorithm SHA256).Hash.ToLowerInvariant()
            $sidecar = ((Get-Content -LiteralPath "resources\patches\$patch.sha256" -Raw) -split "\s+")[0]
            if ($sidecar -ne $dllHash) {
              throw "Le sidecar $patch.sha256 ne correspond pas au DLL : $sidecar != $dllHash"
            }
          }
          npm run build

      - name: Build the diagnostics helper
        run: npm run build:diagnostics

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + electron
        run: |
          npm run build:electron
          npm run build:renderer

      - name: Verify the sandboxed renderer
        run: node scripts/test-renderer-sandbox.mjs

      - name: Package NSIS installer
        if: steps.reuse.outputs.reused != 'true'
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=${{ steps.signing.outputs.signed }}
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify packaged artifacts and Authenticode signatures
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        env:
          RELEASE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $targets = @(
            Get-ChildItem -LiteralPath release -File -Filter "ROTK-Launcher-*.exe"
            Get-Item -LiteralPath "release\win-unpacked\ROTK Launcher.exe"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\steam_api64.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\vivoxsdk_x64.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\patches\vivoxsdk_x64_v5.dll"
            Get-Item -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe"
          )
          if ($targets.Count -lt 6) {
            throw "The installer, packaged launcher, runtime compatibility DLL or diagnostic helper is missing."
          }
          $helperPackagedHash = (Get-FileHash -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperPackagedSidecar = ((Get-Content -LiteralPath "release\win-unpacked\resources\diagnostics\ROTK.Diagnostics.exe.sha256" -Raw) -split "\s+")[0]
          if ($helperPackagedSidecar -ne $helperPackagedHash) { throw "Packaged diagnostic helper sidecar mismatch (including Authenticode bytes)." }

          $vivoxRuntime = $targets |
            Where-Object { $_.Name -eq "vivoxsdk_x64_v5.dll" } |
            Select-Object -First 1
          $vivoxHash = (Get-FileHash -LiteralPath $vivoxRuntime.FullName -Algorithm SHA256).Hash
          $vivoxProxy = $targets |
            Where-Object { $_.Name -eq "vivoxsdk_x64.dll" } |
            Select-Object -First 1
          $proxyHash = (Get-FileHash -LiteralPath $vivoxProxy.FullName -Algorithm SHA256).Hash
          if ($proxyHash -ne "566C0940F7BA62A1DCCAFB8482F39F151BF052E00C97BB8C737E77487879ACD0") {
            throw "Unexpected packaged Vivox proxy SHA-256: $proxyHash"
          }

          if ($vivoxHash -ne "33A7F704EDA23DDA9CCBD9EBA1FDA2F0589211E9C61EC9D1F9C797ACC624EA44") {
            throw "Unexpected packaged Vivox 5 runtime SHA-256: $vivoxHash"
          }
          $vivoxSignature = Get-AuthenticodeSignature -LiteralPath $vivoxRuntime.FullName
          if ($vivoxSignature.Status -ne "Valid" -or -not $vivoxSignature.SignerCertificate) {
            throw "The packaged Vivox 5 runtime has an invalid Authenticode signature."
          }
          if ($vivoxSignature.SignerCertificate.Subject -notmatch "CN=Unity Technologies SF") {
            throw "The packaged Vivox 5 runtime was not signed by Unity Technologies SF."
          }
          if (-not $vivoxSignature.TimeStamperCertificate) {
            throw "The packaged Vivox 5 runtime has no trusted timestamp."
          }

          if ($env:RELEASE_SIGNED -ne "true") {
            Write-Warning "Unsigned release: skipping Authenticode verification."
            "Authenticode publisher: none (unsigned release)" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $publisher = $null
          $projectTargets = $targets | Where-Object { $_.Name -notin @("vivoxsdk_x64_v5.dll", "vivoxsdk_x64.dll") }
          foreach ($target in $projectTargets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "Invalid Authenticode signature on $($target.Name): $($signature.Status)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The Authenticode signature on $($target.Name) has no trusted timestamp."
            }
            if ($null -eq $publisher) {
              $publisher = $signature.SignerCertificate.Subject
            } elseif ($publisher -ne $signature.SignerCertificate.Subject) {
              throw "Release files were signed by different publisher identities."
            }
          }
          if ($publisher -ne $env:EXPECTED_WINDOWS_PUBLISHER) {
            throw "Unexpected Authenticode publisher: $publisher"
          }
          "Authenticode publisher: $publisher" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
            Sort-Object Name
          if (-not $artifacts) { throw "No release artifact was produced." }
          $lines = foreach ($a in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($a.Name)"
          }
          $lines | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
              Select-Object -ExpandProperty FullName
          )
          $files += (Resolve-Path -LiteralPath release\SHA256SUMS.txt).Path
          if (Test-Path release\latest.yml) {
            $files += (Resolve-Path -LiteralPath release\latest.yml).Path
          }
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (draft or published). Refresh assets.
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            # Publish immediately (no --draft): friends can grab it right away.
            gh release create $env:GITHUB_REF_NAME @files `
              --generate-notes `
              --latest `
              --title "rotk-nulled $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed." }
