name: Release Windows
# Fork release workflow for sinnafuls/rotk-nulled. Releases are unsigned: no
# Authenticode credential is configured, so electron-builder never signs and
# the packaged launcher is checked to carry no project signature.
#
# 1. Run this workflow manually on main: it builds, verifies and uploads the
#    installer for that exact commit, without publishing anything.
# 2. Push the vX.Y.Z tag on that same commit: the tag run reuses the verified
#    installer (or rebuilds and re-verifies it) and publishes the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      CI: "true"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release source and version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "^v$([regex]::Escape($packageVersion))(-fork\.[1-9][0-9]*)?$"
            if ($env:GITHUB_REF_NAME -notmatch $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME must be v$packageVersion or v$packageVersion-fork.N."
            }
          } elseif ($env:GITHUB_REF_NAME -ne "main") {
            throw "Manual release verification must run from main."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit is not part of origin/main."
          }

      - name: Test exact-main installer reuse guards
        run: python -m unittest discover -s scripts -p 'test_reuse_release.py' -v

      - name: Reuse the installer verified on this exact main commit
        id: reuse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reuse-release.py

      - name: Install Node.js
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Zig
        if: steps.reuse.outputs.reused != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Match CI: compile from a fresh Windows object cache.
          use-cache: false

      - name: Keep the Zig local cache apart from the global one
        if: steps.reuse.outputs.reused != 'true'
        # setup-zig points the local and global Zig caches at the same folder;
        # zig cc then loses the object it just compiled when it links
        # (lld-link: could not open .zig-cache\o\…\crouch_state_cache_test.obj).
        # A later GITHUB_ENV export overrides the action's.
        shell: pwsh
        run: '"ZIG_LOCAL_CACHE_DIR=$env:RUNNER_TEMP\zig-local-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Install locked dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: npm ci

      - name: Verify the bundled official Vivox 5 runtime
        if: steps.reuse.outputs.reused != 'true'
        run: npm run verify:vivox-runtime

      - name: Rebuild and verify the open-source shim
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          npm run build:shim
          if ($LASTEXITCODE -ne 0) { throw "Shim build failed." }
          $rebuilt = Join-Path $env:GITHUB_WORKSPACE "native\steamshim\dist\steam_api64.dll"
          $bundled = Join-Path $env:GITHUB_WORKSPACE "resources\patches\steam_api64.dll"
          $rebuiltHash = (Get-FileHash -LiteralPath $rebuilt -Algorithm SHA256).Hash
          $bundledHash = (Get-FileHash -LiteralPath $bundled -Algorithm SHA256).Hash
          if ($rebuiltHash -ne $bundledHash) {
            throw "Bundled shim does not match its public source: $bundledHash != $rebuiltHash"
          }
          npm run test:native:menu-duo
          if ($LASTEXITCODE -ne 0) { throw "Native Duo/Trio menu tests failed." }

      - name: Test and build
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $helperBundledHash = (Get-FileHash -LiteralPath "resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash
          npm run build:diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic helper build failed." }
          $helperRebuiltHash = (Get-FileHash -LiteralPath "resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash
          if ($helperBundledHash -ne $helperRebuiltHash) {
            throw "Bundled diagnostic helper does not match its public source."
          }
          npm run build:vivox
          if ($LASTEXITCODE -ne 0) { throw "Vivox release input validation failed." }
          $proxyHash = (Get-FileHash -LiteralPath "resources\patches\vivoxsdk_x64.dll" -Algorithm SHA256).Hash
          if ($proxyHash -ne "566C0940F7BA62A1DCCAFB8482F39F151BF052E00C97BB8C737E77487879ACD0") {
            throw "Unexpected Vivox proxy SHA-256: $proxyHash"
          }
          npm run prepare:gameplay-patch
          if ($LASTEXITCODE -ne 0) { throw "Gameplay patch build or tests failed." }
          $gameplayHash = (Get-FileHash -LiteralPath "resources\patches\dinput8.dll" -Algorithm SHA256).Hash
          if ($gameplayHash -ne "7DE5B115A302A44042B7361BF31112A66B473AA8E21F21AE29572FF254EAFC30") {
            throw "Unexpected shotgun sprint proxy SHA-256: $gameplayHash"
          }
          # Upstream 2.0.40 supplied anticheat module (docs/RELEASE_2_0_40.md).
          $rotkcHash = (Get-FileHash -LiteralPath "resources\patches\rotkc.dll" -Algorithm SHA256).Hash
          if ($rotkcHash -ne "4765861DC893A103F531874E18970EA5B99755D0E5EAFA60F710AABA0067A6ED") {
            throw "Unexpected rotkc.dll SHA-256: $rotkcHash"
          }
          # The sidecars feed the embedded attestation overrides: a mismatch
          # would report every honest player as deviating on that file.
          foreach ($patch in @("steam_api64.dll", "vivoxsdk_x64.dll", "vivoxsdk_x64_v5.dll", "dinput8.dll")) {
            $dllHash = (Get-FileHash -LiteralPath "resources\patches\$patch" -Algorithm SHA256).Hash.ToLowerInvariant()
            $sidecar = ((Get-Content -LiteralPath "resources\patches\$patch.sha256" -Raw) -split "\s+")[0]
            if ($sidecar -ne $dllHash) {
              throw "Sidecar $patch.sha256 does not match the DLL: $sidecar != $dllHash"
            }
          }
          # verify:presentmon, diagnostics, both TypeScript configs, all tests,
          # then the electron and renderer bundles.
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Typecheck, tests or launcher build failed." }

      - name: Verify the sandboxed renderer
        if: steps.reuse.outputs.reused != 'true'
        run: node scripts/test-renderer-sandbox.mjs

      - name: Package unsigned NSIS installer
        if: steps.reuse.outputs.reused != 'true'
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=false

      - name: Verify packaged artifacts and unsigned status
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $unpacked = "release\win-unpacked"
          $installer = Get-Item -LiteralPath "release\ROTK-Launcher-$version-x64.exe"
          $launcher = Get-Item -LiteralPath "$unpacked\ROTK Launcher.exe"
          $shim = Get-Item -LiteralPath "$unpacked\resources\patches\steam_api64.dll"
          $vivoxProxy = Get-Item -LiteralPath "$unpacked\resources\patches\vivoxsdk_x64.dll"
          $vivoxRuntime = Get-Item -LiteralPath "$unpacked\resources\patches\vivoxsdk_x64_v5.dll"
          $gameplay = Get-Item -LiteralPath "$unpacked\resources\patches\dinput8.dll"
          $rotkc = Get-Item -LiteralPath "$unpacked\resources\patches\rotkc.dll"
          $helper = Get-Item -LiteralPath "$unpacked\resources\diagnostics\ROTK.Diagnostics.exe"

          $helperPackagedHash = (Get-FileHash -LiteralPath $helper.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperPackagedSidecar = ((Get-Content -LiteralPath "$($helper.FullName).sha256" -Raw) -split "\s+")[0]
          if ($helperPackagedSidecar -ne $helperPackagedHash) { throw "Packaged diagnostic helper sidecar mismatch." }

          # Unsigned packaging must ship the verified source bytes unchanged.
          $shimHash = (Get-FileHash -LiteralPath $shim.FullName -Algorithm SHA256).Hash
          $shimSourceHash = (Get-FileHash -LiteralPath "resources\patches\steam_api64.dll" -Algorithm SHA256).Hash
          if ($shimHash -ne $shimSourceHash) { throw "Packaged Steam shim differs from the verified source build." }
          $helperSourceHash = (Get-FileHash -LiteralPath "resources\diagnostics\ROTK.Diagnostics.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helperPackagedHash -ne $helperSourceHash) { throw "Packaged diagnostic helper differs from the verified source build." }

          $proxyHash = (Get-FileHash -LiteralPath $vivoxProxy.FullName -Algorithm SHA256).Hash
          if ($proxyHash -ne "566C0940F7BA62A1DCCAFB8482F39F151BF052E00C97BB8C737E77487879ACD0") {
            throw "Unexpected packaged Vivox proxy SHA-256: $proxyHash"
          }
          $gameplayHash = (Get-FileHash -LiteralPath $gameplay.FullName -Algorithm SHA256).Hash
          if ($gameplayHash -ne "7DE5B115A302A44042B7361BF31112A66B473AA8E21F21AE29572FF254EAFC30") {
            throw "Unexpected packaged shotgun sprint proxy SHA-256: $gameplayHash"
          }
          $rotkcHash = (Get-FileHash -LiteralPath $rotkc.FullName -Algorithm SHA256).Hash
          if ($rotkcHash -ne "4765861DC893A103F531874E18970EA5B99755D0E5EAFA60F710AABA0067A6ED") {
            throw "Unexpected packaged rotkc.dll SHA-256: $rotkcHash"
          }

          $vivoxHash = (Get-FileHash -LiteralPath $vivoxRuntime.FullName -Algorithm SHA256).Hash
          if ($vivoxHash -ne "33A7F704EDA23DDA9CCBD9EBA1FDA2F0589211E9C61EC9D1F9C797ACC624EA44") {
            throw "Unexpected packaged Vivox 5 runtime SHA-256: $vivoxHash"
          }
          $vivoxSignature = Get-AuthenticodeSignature -LiteralPath $vivoxRuntime.FullName
          if ($vivoxSignature.Status -ne "Valid" -or -not $vivoxSignature.SignerCertificate) {
            throw "The packaged Vivox 5 runtime has an invalid Authenticode signature."
          }
          if ($vivoxSignature.SignerCertificate.Subject -notmatch "CN=Unity Technologies SF") {
            throw "The packaged Vivox 5 runtime was not signed by Unity Technologies SF."
          }
          if (-not $vivoxSignature.TimeStamperCertificate) {
            throw "The packaged Vivox 5 runtime has no trusted timestamp."
          }

          foreach ($target in @($installer, $launcher, $shim, $helper)) {
            $status = (Get-AuthenticodeSignature -LiteralPath $target.FullName).Status
            if ($status -ne "NotSigned") {
              throw "$($target.Name) carries an Authenticode signature ($status) although this release is unsigned."
            }
          }
          Write-Warning "Unsigned release: verify downloads against SHA256SUMS.txt and the GitHub provenance attestation."
          "Authenticode publisher: none (unsigned release). Verify downloads against SHA256SUMS.txt and the GitHub provenance attestation." >> $env:GITHUB_STEP_SUMMARY

      - name: Generate SHA-256 checksums
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
            Sort-Object Name
          if (-not $artifacts) { throw "No release artifact was generated." }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Record the exact prepared installer and installed DLL hashes
        if: steps.reuse.outputs.reused != 'true'
        run: python scripts/record-prepared-release.py

      - name: Attest installer provenance
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/ROTK-Launcher-*.exe

      - name: Upload the verified installer for exact-commit reuse
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotk-launcher-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/ROTK-Launcher-*.exe
            release/ROTK-Launcher-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/prepared-release.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = "ROTK-Launcher-$version-x64.exe"
          $releaseFiles = @(
            (Resolve-Path -LiteralPath "release\$installer").Path
            (Resolve-Path -LiteralPath "release\$installer.blockmap").Path
            (Resolve-Path -LiteralPath release\SHA256SUMS.txt).Path
            (Resolve-Path -LiteralPath release\latest.yml).Path
          )
          $notes = "Unsigned build (no Authenticode certificate). Verify the installer against SHA256SUMS.txt and with ``gh attestation verify $installer --repo $env:GITHUB_REPOSITORY``."
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw "Refusing to replace artifacts of an already published release."
            }
            gh release upload $env:GITHUB_REF_NAME @releaseFiles --clobber
            if ($LASTEXITCODE -ne 0) { throw "Draft release artifact upload failed." }
            gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          } else {
            gh release create $env:GITHUB_REF_NAME @releaseFiles `
              --verify-tag `
              --generate-notes `
              --notes $notes `
              --latest `
              --title "rotk-nulled $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed." }
