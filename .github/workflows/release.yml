name: Release
# Fork release workflow for sinnafuls/rotk-nulled.
#
# Rebuilds the Zig-based gameplay patch and the .NET diagnostics helper;
# verifies the pinned native hashes; packages an unsigned NSIS installer;
# publishes a release immediately (no draft).
#
# Native test suites are NOT re-run here (they run in CI on every push to
# main). This workflow only fires on a version tag, so main is already green
# by definition.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      CI: "true"

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag matches package.json version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion."
          }

      - name: Test exact-main installer reuse guards
        run: python -m unittest discover -s scripts -p 'test_reuse_release.py' -v

      - name: Reuse the prepared installer from this exact main commit
        id: reuse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reuse-release.py

      - name: Install Node.js
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Zig
        if: steps.reuse.outputs.reused != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Install .NET (diagnostics helper)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Split the Zig object cache from the global one
        shell: pwsh
        run: '"ZIG_LOCAL_CACHE_DIR=$env:RUNNER_TEMP\zig-local-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Zig object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-local-cache
          key: zig-cache-${{ runner.os }}-0.15.2-${{ hashFiles('native/gameplaypatch/**/*.c', 'native/gameplaypatch/**/*.h', 'native/gameplaypatch/build-gameplay-patch.ps1') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-0.15.2-

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('native/**/*.csproj', 'native/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify the pinned Vivox proxy
        shell: pwsh
        run: |
          # The proxy is upstream's own OPTI1 build. The fork no longer pins a
          # previous binary; it prevents the server-supplied module from ever
          # loading by removing rotkc.dll instead (see game-launcher.ts).
          $h = (Get-FileHash -LiteralPath "resources\patches\vivoxsdk_x64.dll" -Algorithm SHA256).Hash
          if ($h.ToUpperInvariant() -ne "D74662295AF61D152A1869B2925D403AE984827BB55268CC20025D07EC9DABD5") {
            throw "Vivox proxy SHA-256 mismatch: got $h"
          }
          npm run test:native:menu-duo
          if ($LASTEXITCODE -ne 0) { throw "Native Duo/Trio menu tests failed." }

      - name: Build the gameplay patch (dinput8.dll)
        shell: pwsh
        run: |
          npm run build:gameplay-patch
          $h = (Get-FileHash -LiteralPath "resources\patches\dinput8.dll" -Algorithm SHA256).Hash
          if ($h.ToUpperInvariant() -ne "987FA5657408422D984A31F18739AF4514221CF25BE3D5DE31E3A64EDCB54649") {
            throw "Gameplay patch SHA-256 mismatch: got $h"
          }

      - name: Build the diagnostics helper
        run: npm run build:diagnostics

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + electron
        run: |
          npm run build:electron
          npm run build:renderer

      - name: Verify the sandboxed renderer
        run: node scripts/test-renderer-sandbox.mjs

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=false --config.win.signExecutable=false

      - name: Generate SHA-256 checksums
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
            Sort-Object Name
          if (-not $artifacts) { throw "No release artifact was produced." }
          $lines = foreach ($a in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($a.Name)"
          }
          $lines | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name -match '\.(exe|blockmap)$' } |
              Select-Object -ExpandProperty FullName
          )
          $files += (Resolve-Path -LiteralPath release\SHA256SUMS.txt).Path
          if (Test-Path release\latest.yml) {
            $files += (Resolve-Path -LiteralPath release\latest.yml).Path
          }
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (draft or published). Refresh assets.
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            # Publish immediately (no --draft): friends can grab it right away.
            gh release create $env:GITHUB_REF_NAME @files `
              --generate-notes `
              --latest `
              --title "rotk-nulled $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed." }
